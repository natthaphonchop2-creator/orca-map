<!doctype html>
<html lang="en" class="default-scrollbar">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.ico?v=orca-kit-20260929" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=orca-kit-20260929" />
		<link rel="icon" type="image/svg+xml" href="/orca/favicon.svg?v=orca-kit-20260929" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=orca-kit-20260929" />
		<script id="orca-theme-boot">
			// Before the first paint, so no page flashes the wrong theme.
			// Same rules as routeTheme() and applyTheme() in src/lib/orca/theme.ts, and the
			// same default as DEFAULT_THEME_PREFERENCE; theme.test.mjs runs this script against them.
			(function () {
				var fallback = 'system';
				var preference = fallback;
				var systemDark = false;
				try {
					preference = window.localStorage.getItem('orca.theme');
				} catch (e) {}
				if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = fallback;
				try {
					systemDark =
						typeof window.matchMedia === 'function' &&
						window.matchMedia('(prefers-color-scheme: dark)').matches === true;
				} catch (e) {}
				var path = window.location.pathname;
				var dark = false;
				if (path === '/login' || path.indexOf('/login/') === 0) dark = true;
				else if (path === '/' || path === '/app' || path.indexOf('/app/') === 0)
					dark = preference === 'dark' || (preference === 'system' && systemDark);
				var root = document.documentElement;
				root.setAttribute('data-orca-theme', dark ? 'dark' : 'light');
				if (dark) root.classList.add('dark');
				else root.classList.remove('dark');
				root.setAttribute('data-theme', dark ? 'nanobotdark' : 'nanobotlight');
				root.style.colorScheme = dark ? 'dark' : 'light';
			})();
		</script>
		<style>
			#initial-loader {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #ffffff;
				z-index: 9999;
				transition: opacity 0.15s ease-out;
			}
			html[data-orca-theme='dark'] #initial-loader {
				background: #08090a;
			}
			#initial-loader .spinner {
				box-sizing: border-box;
				width: 32px;
				height: 32px;
				border: 3px solid rgba(21, 24, 35, 0.12);
				border-top-color: #151823;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			html[data-orca-theme='dark'] #initial-loader .spinner {
				border-color: rgba(255, 255, 255, 0.12);
				border-top-color: #d7f471;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			#initial-loader.loaded {
				opacity: 0;
				pointer-events: none;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="initial-loader"><div class="spinner"></div></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
